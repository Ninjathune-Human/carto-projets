[package]
name = "carto-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carto-cad = { path = "../cad" }
carto-georef = { path = "../georef" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-time = "1"

[dev-dependencies]
acadrust = { version = "0.6.8", default-features = false }
wasm-bindgen-test = "0.3"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
