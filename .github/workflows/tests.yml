name: tests

# Tests de toute la branche : sur chaque pull request, et avant chaque publication (appelé par
# pages.yml). Aucun secret ; lecture seule.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Installer Rust stable et la cible wasm32
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Installer wasm-pack
        run: cargo install wasm-pack --locked
      - name: Tests natifs
        run: cargo test --workspace
      - name: Tests wasm (Node)
        run: wasm-pack test --node crates/wasm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installer les dépendances de essais/libredwg
        run: npm ci
        working-directory: essais/libredwg
      - name: Tests Node
        run: >
          node --test
          'essais/banc/test/*.test.mjs'
          'essais/carte/test/*.test.mjs'
          'essais/sources/test/*.test.mjs'
          'essais/commun/test/*.test.mjs'
          'essais/libredwg/test/*.test.mjs'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tests Python
        run: |
          pip install -r tools/requirements.txt
          python3 -m pytest tools/tests
      - name: Construire le module wasm
        run: wasm-pack build crates/wasm --target web --release
