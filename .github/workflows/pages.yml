name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Installer Rust stable et la cible wasm32
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Installer wasm-pack
        run: cargo install wasm-pack --locked
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Construire le module wasm
        run: wasm-pack build crates/wasm --target web --release --out-dir ../../essais/banc/pkg
      - name: Assembler le site (_site)
        env:
          CLE_ESRI: ${{ secrets.CLE_ESRI }}
        run: |
          mkdir -p _site/essais
          cp index.html banniere.svg catalogue.json _site/
          if [ -d data ]; then cp -r data _site/data; fi
          cp -r essais/banc essais/carte essais/sources essais/visionneuse essais/commun _site/essais/
          rm -rf _site/essais/banc/test _site/essais/carte/test _site/essais/sources/test _site/essais/commun/test _site/essais/visionneuse/test
          python3 -c 'import json, os; print("export const CLE_ESRI = %s;" % json.dumps(os.environ.get("CLE_ESRI", "").strip()))' > _site/essais/carte/config.js
          du -sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publier sur Pages
        id: deployment
        uses: actions/deploy-pages@v5

  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Déplacer le tag deploye
        run: git tag -f deploye "$GITHUB_SHA" && git push -f origin deploye
